name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Hugging Face token
        id: hf-token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is not configured. Skipping Hugging Face sync."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: huggingface/hub-sync@v0.1.0
        if: steps.hf-token.outputs.configured == 'true'
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: digitalculturologist/xquendart
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
